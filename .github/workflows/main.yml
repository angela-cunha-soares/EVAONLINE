name: Criar VM ARM Oracle
on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

jobs:
  launch:
    runs-on: ubuntu-latest
    env:
      OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
      OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
      OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
    steps:
      - name: Instalar OCI CLI
        run: |
          curl -sL https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh -o install.sh
          bash install.sh --accept-all-defaults >/dev/null
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Tentar criar a VM
        run: |
          set -uo pipefail
          C="${{ secrets.OCI_CLI_TENANCY }}"
          SUBNET="ocid1.subnet.oc1.sa-saopaulo-1.aaaaaaaarl7ii6jlweguwmeit73kuiv37liye5nfp3dimhowm3iedpjajrea"
          echo "ssh-rsa  angelassil@54ebc6d8a9f9" > /tmp/key.pub

          AD=$(oci iam availability-domain list --compartment-id "$C" --query 'data[0].name' --raw-output)
          echo "AD: $AD"

          IMG=$(oci compute image list --compartment-id "$C" \
            --operating-system "Canonical Ubuntu" --operating-system-version "22.04" \
            --shape "VM.Standard.A1.Flex" --sort-by TIMECREATED \
            --query 'data[0].id' --raw-output)
          if [ -z "$IMG" ] || [ "$IMG" = "null" ]; then
            echo "Nao encontrei imagem Ubuntu 22.04 para A1. Abortando este ciclo."
            exit 1
          fi
          echo "IMG: $IMG"

          # Nao recriar se ja existe uma instancia nao-terminada com esse nome
          EXIST=$(oci compute instance list --compartment-id "$C" \
            --display-name "evaonline-server" \
            --query "data[?\"lifecycle-state\"!='TERMINATED'] | [0].id" \
            --raw-output 2>/dev/null)
          if [ -n "$EXIST" ] && [ "$EXIST" != "null" ]; then
            echo "Ja existe uma instancia evaonline-server (nao terminada): $EXIST"
            exit 0
          fi

          CREATED=0
          # Novo limite da conta: 2 OCPU / 12 GB. Comeca no maximo permitido.
          for CONFIG in "2 12" "1 6"; do
            set -- $CONFIG
            OCPUS=$1; MEM=$2
            echo "=========================================="
            echo ">> Tentando $OCPUS OCPU / $MEM GB ..."
            OUT=$(oci compute instance launch \
              --availability-domain "$AD" --compartment-id "$C" \
              --shape "VM.Standard.A1.Flex" \
              --shape-config "{\"ocpus\":$OCPUS,\"memoryInGBs\":$MEM}" \
              --image-id "$IMG" --subnet-id "$SUBNET" --assign-public-ip true \
              --display-name "evaonline-server" \
              --ssh-authorized-keys-file /tmp/key.pub \
              --boot-volume-size-in-gbs 50 2>&1) || true

            if echo "$OUT" | grep -qi 'ocid1.instance'; then
              echo "🎉 SUCESSO! VM criada com $OCPUS OCPU / $MEM GB."
              echo "$OUT" | grep -i 'ocid1.instance' | head -1
              CREATED=1
              break
            elif echo "$OUT" | grep -qiE 'out of host capacity|capacity'; then
              echo "   Sem capacidade para $OCPUS/$MEM. Tentando proxima opcao..."
            elif echo "$OUT" | grep -qiE 'limitexceeded|exceed(ed)? the .*limit|service limit'; then
              echo "   Limite da conta atingido em $OCPUS/$MEM (reduza a config):"
              echo "$OUT" | grep -Ei '"code"|"message"' | head -3
            else
              echo "   Erro diferente em $OCPUS/$MEM:"
              echo "$OUT" | grep -Ei '"code"|"message"' | head -3
            fi
          done

          if [ "$CREATED" = "0" ]; then
            echo "Nenhuma opcao teve capacidade agora. Tenta de novo no proximo ciclo."
          fi
