[pytest]
# ============================================================================
# EVAonline - PYTEST CONFIGURATION
# ============================================================================

# Test discovery
testpaths = backend/tests frontend/tests

# Standard patterns for test files
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Personal Markers
markers =
    unit: Unit tests (isolated functions)
    integration: Integration tests (multiple components)
    e2e: End-to-end tests (full workflow)
    performance: Performance tests
    security: Security tests
    slow: Tests that take longer than 5 seconds
    requires_db: Tests that require PostgreSQL
    requires_postgres: Tests that require PostgreSQL
    requires_redis: Tests that require Redis
    requires_celery: Tests that require Celery
    api: API route tests
    database: Model and query tests
    cache: Cache tests
    websocket: WebSocket tests

# Standard options
addopts =
    -ra
    --strict-markers
    --strict-config
    --showlocals
    --tb=short
    --cov-branch
    --cov-report=term-missing:skip-covered
    --cov-report=html
    --cov-report=xml
    -p no:warnings

# Standard Timeout
timeout = 300
timeout_method = thread

# Asyncio
asyncio_mode = auto

# Coverage
[coverage:run]
source =
    backend
    frontend
    shared_utils
    config
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */migrations/*
    */alembic/*
    */.venv/*
    */venv/*

[coverage:report]
precision = 2
skip_empty = True
show_missing = True
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod
    